---
- name: Include wireguard vars
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - vars/wireguard.yaml
    - vars/secrets.yaml

- name: Install wireguard and iptables
  ansible.builtin.apt:
    name:
      - wireguard
      - iptables
    state: present
    update_cache: yes
  become: yes

- name: Generate keys and configure WireGuard
  when: not ansible_check_mode
  block:
    - name: Check if server keys already exist
      ansible.builtin.stat:
        path: "{{ wireguard_key_dir }}/server_private.key"
      register: wg_key_exists

    - name: Generate WireGuard server private key
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > {{ wireguard_key_dir }}/server_private.key
      when: not wg_key_exists.stat.exists
      become: yes

    - name: Derive WireGuard server public key
      ansible.builtin.shell:
        cmd: wg pubkey < {{ wireguard_key_dir }}/server_private.key > {{ wireguard_key_dir }}/server_public.key
      when: not wg_key_exists.stat.exists
      become: yes

    - name: Read server private key
      ansible.builtin.slurp:
        src: "{{ wireguard_key_dir }}/server_private.key"
      register: wg_server_private_key
      become: yes

    - name: Detect default network interface
      ansible.builtin.shell:
        cmd: ip route show default | awk '/default/ {print $5; exit}'
      register: default_interface
      changed_when: false

    - name: Deploy WireGuard config
      ansible.builtin.copy:
        dest: /etc/wireguard/{{ wireguard_interface }}.conf
        mode: "0600"
        content: |
          [Interface]
          PrivateKey = {{ wg_server_private_key.content | b64decode | trim }}
          Address = {{ wireguard_server_ip }}
          ListenPort = {{ wireguard_port }}
          PostUp = iptables -A FORWARD -i {{ wireguard_interface }} -j ACCEPT; iptables -t nat -A POSTROUTING -o {{ default_interface.stdout }} -j MASQUERADE
          PostDown = iptables -D FORWARD -i {{ wireguard_interface }} -j ACCEPT; iptables -t nat -D POSTROUTING -o {{ default_interface.stdout }} -j MASQUERADE

          [Peer]
          PublicKey = {{ wireguard_client_public_key }}
          AllowedIPs = {{ wireguard_client_ip }}
      become: yes
      notify:
        - Restart wireguard

    - name: Enable IP forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-wireguard.conf
        content: |
          net.ipv4.ip_forward = 1
      become: yes

    - name: Apply sysctl
      ansible.builtin.shell:
        cmd: sysctl -p /etc/sysctl.d/99-wireguard.conf
      become: yes
      changed_when: false

    - name: Read server public key
      ansible.builtin.slurp:
        src: "{{ wireguard_key_dir }}/server_public.key"
      register: wg_server_public_key
      become: yes

    - name: Output server public key for client config
      ansible.builtin.debug:
        msg: "WireGuard server public key: {{ wg_server_public_key.content | b64decode | trim }}"

    - name: Enable and start WireGuard
      ansible.builtin.systemd:
        name: wg-quick@{{ wireguard_interface }}
        enabled: true
        state: started
      become: yes
