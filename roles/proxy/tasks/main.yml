---
- name: Include proxy vars
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - vars/proxy.yaml
    - vars/secrets.yaml

- name: Upgrade system packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
  tags: always

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: yes
  become: yes

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  become: yes

- name: Restart unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: restarted
  become: yes

- name: Add system-wide alias ll='ls -al'
  ansible.builtin.lineinfile:
    path: /etc/profile
    regexp: '^alias ll='
    line: "alias ll='ls -al'"
    state: present
  become: yes

- name: Install squid package
  ansible.builtin.apt:
    name: squid
    state: present
    update_cache: yes
  become: yes

- name: Install apache2-utils package
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: yes
  become: yes

- name: Create htpasswd file
  ansible.builtin.shell:
    cmd: htpasswd -cb /etc/squid/passwords {{ htpasswd_username }} {{ htpasswd_password }}
    creates: /etc/squid/passwords
  become: yes
  no_log: true

- name: Copy squid.conf file to server
  copy:
    src: squid.conf
    dest: /etc/squid/
    owner: root
    group: root
  notify:
    - Start squid

